<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle">
      <span class="toggle-icon">&#9790;</span>
      <span class="toggle-label">LIGHT</span>
    </button>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">SKIN</span>
          <select id="skin-select" class="skin-select">
            <option value="retro">RETRO</option>
            <option value="neon">NEON</option>
            <option value="pastel">PASTEL</option>
            <option value="pixel">PIXEL ART</option>
          </select>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div id="gameover-content">
          <p id="overlay-stats"></p>

          <div id="new-record-form" class="hidden">
            <p class="new-record-label">¡NUEVO RECORD! ESCRIBE TU NOMBRE</p>
            <input id="player-name-input" type="text" maxlength="12" placeholder="TU NOMBRE" autocomplete="off" />
            <button id="save-score-btn">GUARDAR</button>
          </div>

          <div class="records-panel">
            <span class="label">TOP 5 RECORDS</span>
            <div class="scores-table-wrap">
              <table id="gameover-scores-table" class="scores-table"></table>
            </div>
          </div>

          <button id="restart-btn">Reiniciar</button>
        </div>

        <div id="pause-menu" class="pause-menu hidden">
          <div id="pause-main" class="pause-view">
            <button id="pm-resume-btn" class="pm-btn pm-btn-primary">Reanudar</button>
            <button id="pm-restart-btn" class="pm-btn">Reiniciar</button>
            <button id="pm-controls-btn" class="pm-btn">Ver controles</button>
            <div class="pm-level-select">
              <label for="pm-level-input">Nivel inicial</label>
              <select id="pm-level-input"></select>
            </div>
          </div>

          <div id="pause-controls" class="pause-view hidden">
            <ul class="pm-controls-list">
              <li><kbd>&larr;</kbd><kbd>&rarr;</kbd> mover</li>
              <li><kbd>&uarr;</kbd> / <kbd>X</kbd> rotar</li>
              <li><kbd>&darr;</kbd> bajar</li>
              <li><kbd>Space</kbd> caída</li>
              <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
            </ul>
            <button id="pm-back-btn" class="pm-btn">Volver</button>
          </div>
        </div>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box start-box">
        <p class="start-title">TETRIS</p>

        <div class="records-panel">
          <span class="label">TOP 5 RECORDS</span>
          <div class="scores-table-wrap">
            <table id="start-scores-table" class="scores-table"></table>
          </div>
        </div>

        <button id="play-btn" class="primary-btn">JUGAR</button>
        <button id="reset-scores-btn" class="secondary-btn">RESETEAR RECORDS</button>
      </div>
    </div>
  </div>

  <script src="skins.js"></script>
  <script src="scores.js"></script>
  <script src="menu.js"></script>
  <script src="game.js"></script>
</body>
</html>
